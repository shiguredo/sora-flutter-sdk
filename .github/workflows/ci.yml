# Dart / Kotlin / Swift の静的 check と devtools の Android / iOS build を行う。
# push と手動実行の両方を許可し、重い build を必要なタイミングで明示実行できるようにする。
# Slack 通知は sora-js-sdk と同じ `slack_notify` ジョブ構成と
# `shiguredo/github-actions` の `slack-notify` action を使う。
name: CI

on:
  # Actions 画面から任意のタイミングで再実行できるようにする。
  workflow_dispatch:
  push:
    # Android build は重いため、CI に関係する変更だけで実行する。
    paths:
      - ".clang-format"
      - ".github/workflows/ci.yml"
      - ".editorconfig"
      - ".swiftlint.yml"
      - "analysis_options.yaml"
      - "android/**"
      - "ios/**"
      - "macos/**"
      - "devtools/**"
      - "lib/**"
      - "prek.toml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/**"
      - "test/**"

permissions:
  contents: read

concurrency:
  # 同じ branch への連続 push では古い実行を止め、重い build を無駄に回さない。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter は公式 archive を直接取得し、SDK 本体ごと cache する。
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.0
  # ローカルの `prek` 実行環境と Apple CI の `swift format` 判定を揃える。
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  # Android / Gradle 側は現行 repository 設定に合わせる。
  JAVA_VERSION: "17"
  KTLINT_VERSION: "1.7.1"
  ANDROID_API_LEVEL: "34"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # Gradle cache は setup-java の公式機能に任せる。
          cache: gradle

      - name: Install ktlint
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint" \
            -o "${HOME}/.local/bin/ktlint"
          chmod +x "${HOME}/.local/bin/ktlint"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install clang-format
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Restore Flutter SDK cache
        id: flutter-sdk-cache
        uses: actions/cache@v5
        with:
          # Flutter SDK 本体と `flutter precache` の成果物をまとめて再利用する。
          path: ~/flutter
          key: ${{ runner.os }}-flutter-sdk-${{ env.FLUTTER_CHANNEL }}-${{
            env.FLUTTER_VERSION }}

      - name: Install Flutter SDK
        if: steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          # 公式 release manifest から対象バージョンの archive path と sha256 を取得する。
          releases_json="${RUNNER_TEMP}/releases_linux.json"

          curl -fsSL \
            "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json" \
            -o "${releases_json}"

          release_info="$(jq -r \
            --arg version "${FLUTTER_VERSION}" \
            --arg channel "${FLUTTER_CHANNEL}" \
            '.releases[]
            | select(.version == $version and .channel == $channel)
            | [.archive, .sha256]
            | @tsv' \
            "${releases_json}" \
            | head -n 1)"

          if [[ -z "${release_info}" ]]; then
            echo "Flutter release ${FLUTTER_VERSION} (${FLUTTER_CHANNEL}) was not found." >&2
            exit 1
          fi

          IFS=$'\t' read -r archive_path archive_sha256 <<< "${release_info}"
          archive_file="${RUNNER_TEMP}/$(basename "${archive_path}")"

          curl -fsSL \
            "https://storage.googleapis.com/flutter_infra_release/releases/${archive_path}" \
            -o "${archive_file}"

          echo "${archive_sha256}  ${archive_file}" | sha256sum -c -
          rm -rf "${HOME}/flutter"
          tar -xJf "${archive_file}" -C "${HOME}"

      - name: Add Flutter to PATH
        run: echo "${HOME}/flutter/bin" >> "${GITHUB_PATH}"

      - name: Restore Pub cache
        uses: actions/cache@v5
        with:
          # package 本体と devtools の両方で使う pub cache を共有する。
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{
            hashFiles('pubspec.yaml', 'pubspec.lock', 'devtools/pubspec.yaml',
            'devtools/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          # Android plugin build 時に自動取得される libwebrtc-c 配布物を再利用する。
          path: third_party/libwebrtc-c
          key: ${{ runner.os }}-native-deps-${{ hashFiles('scripts/native_deps.json') }}

      - name: Restore Android SDK package cache
        uses: actions/cache@v5
        with:
          # runner image 付属の cmdline-tools を使い、追加で取得する package だけを cache する。
          path: |
            /usr/local/lib/android/sdk/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            /usr/local/lib/android/sdk/licenses
            /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
            /usr/local/lib/android/sdk/platforms/android-${{ env.ANDROID_API_LEVEL }}
          key: ${{ runner.os }}-android-sdk-${{ env.ANDROID_API_LEVEL }}-${{
            env.ANDROID_BUILD_TOOLS_VERSION }}-${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          # ubuntu-24.04 image にある sdkmanager を使って不足 package だけを揃える。
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager}" ]]; then
            sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager"
          fi

          yes | "${sdkmanager}" --licenses > /dev/null || true
          "${sdkmanager}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-${ANDROID_API_LEVEL}"

      - name: Show tool versions
        run: |
          set -euo pipefail
          flutter --version
          java -version

      - name: Precache Flutter Android artifacts
        run: |
          set -euo pipefail
          # Android build に必要な engine artifact を先に温め、次回以降は Flutter SDK cache から再利用する。
          flutter precache --android

      - name: Resolve package dependencies
        run: |
          set -euo pipefail
          flutter pub get

      - name: Run package Dart format check
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test

      - name: Run package Dart analyze
        run: |
          set -euo pipefail
          dart analyze --fatal-infos lib test

      - name: Run Android ktlint check
        run: |
          set -euo pipefail
          mapfile -t kotlin_files < <(git ls-files -- '*.kt' '*.kts')
          if (( ${#kotlin_files[@]} > 0 )); then
            ktlint --relative "${kotlin_files[@]}"
          fi

      - name: Run C and C++ clang-format check
        run: |
          set -euo pipefail
          files="$(git ls-files -- '*.cc' '*.h')"
          if [[ -n "${files}" ]]; then
            printf '%s\n' "${files}" | xargs clang-format --dry-run --Werror -style=file -fallback-style=none
          fi

      - name: Run package tests
        run: |
          set -euo pipefail
          flutter test

      - name: Prepare devtools environment file
        run: |
          set -euo pipefail
          # devtools は environment.dart を前提にしているため、CI では example から生成する。
          cp devtools/lib/configs/environment.example.dart devtools/lib/configs/environment.dart

      - name: Resolve devtools dependencies
        working-directory: devtools
        run: |
          set -euo pipefail
          flutter pub get

      - name: Run devtools Dart format check
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed devtools/lib devtools/test

      - name: Run devtools Dart analyze
        working-directory: devtools
        run: |
          set -euo pipefail
          dart analyze --fatal-infos lib test

      - name: Build devtools Android APK
        working-directory: devtools
        run: |
          set -euo pipefail
          # devtools の widget test は現状レイアウト overflow で失敗するため、
          # ここでは package test の後に Android build 成立性を確認する。
          flutter build apk --debug --no-pub

      - name: Upload devtools Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: devtools-android-apk
          path: devtools/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode Version
        run: sudo xcode-select -s "${{ env.XCODE_DEVELOPER_DIR }}"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run Swift format lint
        run: |
          set -euo pipefail
          swift format lint --strict --parallel --recursive \
            ios/sora_sdk/Sources/sora_sdk \
            macos/sora_sdk/Sources/sora_sdk \
            devtools/ios/Runner \
            devtools/ios/RunnerTests \
            devtools/macos/Runner \
            devtools/macos/RunnerTests

      - name: Run SwiftLint
        run: |
          set -euo pipefail
          swiftlint lint --strict --config .swiftlint.yml

      - name: Restore Flutter SDK cache
        id: flutter-sdk-cache-macos
        uses: actions/cache@v5
        with:
          # Flutter SDK 本体と `flutter precache` の成果物をまとめて再利用する。
          path: ~/flutter
          key: ${{ runner.os }}-flutter-sdk-${{ env.FLUTTER_CHANNEL }}-${{
            env.FLUTTER_VERSION }}

      - name: Install Flutter SDK
        if: steps.flutter-sdk-cache-macos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          # 公式 release manifest から対象バージョンの archive path と sha256 を取得する。
          releases_json="${RUNNER_TEMP}/releases_macos.json"

          curl -fsSL \
            "https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json" \
            -o "${releases_json}"

          release_info="$(jq -r \
            --arg version "${FLUTTER_VERSION}" \
            --arg channel "${FLUTTER_CHANNEL}" \
            '.releases[]
            | select(.version == $version and .channel == $channel)
            | [.archive, .sha256]
            | @tsv' \
            "${releases_json}" \
            | head -n 1)"

          if [[ -z "${release_info}" ]]; then
            echo "Flutter release ${FLUTTER_VERSION} (${FLUTTER_CHANNEL}) was not found." >&2
            exit 1
          fi

          IFS=$'\t' read -r archive_path archive_sha256 <<< "${release_info}"
          archive_file="${RUNNER_TEMP}/$(basename "${archive_path}")"

          curl -fsSL \
            "https://storage.googleapis.com/flutter_infra_release/releases/${archive_path}" \
            -o "${archive_file}"

          echo "${archive_sha256}  ${archive_file}" | shasum -a 256 -c -
          rm -rf "${HOME}/flutter"

          case "${archive_file}" in
            *.zip)
              unzip -q "${archive_file}" -d "${HOME}"
              ;;
            *.tar.xz)
              tar -xJf "${archive_file}" -C "${HOME}"
              ;;
            *)
              echo "Unsupported Flutter archive format: ${archive_file}" >&2
              exit 1
              ;;
          esac

      - name: Add Flutter to PATH
        run: echo "${HOME}/flutter/bin" >> "${GITHUB_PATH}"

      - name: Restore Pub cache
        uses: actions/cache@v5
        with:
          # package 本体と devtools の両方で使う pub cache を共有する。
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{
            hashFiles('pubspec.yaml', 'pubspec.lock', 'devtools/pubspec.yaml',
            'devtools/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          # iOS plugin build 時に自動取得される libwebrtc-c 配布物を再利用する。
          path: third_party/libwebrtc-c
          key: ${{ runner.os }}-native-deps-${{ hashFiles('scripts/native_deps.json') }}

      - name: Show tool versions
        run: |
          set -euo pipefail
          flutter --version
          xcodebuild -version

      - name: Precache Flutter iOS artifacts
        run: |
          set -euo pipefail
          # iOS build に必要な engine artifact を先に温め、次回以降は Flutter SDK cache から再利用する。
          flutter precache --ios

      - name: Prepare devtools environment file
        run: |
          set -euo pipefail
          # devtools は environment.dart を前提にしているため、CI では example から生成する。
          cp devtools/lib/configs/environment.example.dart devtools/lib/configs/environment.dart

      - name: Resolve devtools dependencies
        working-directory: devtools
        run: |
          set -euo pipefail
          flutter pub get

      - name: Build devtools iOS app
        working-directory: devtools
        run: |
          set -euo pipefail
          # 現行の native dependency 配布は iphoneos 向けのため、署名なし実機 build で成立性を確認する。
          flutter build ios --release --no-codesign --no-pub

  slack_notify:
    name: Slack Notify
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-flutter-sdk
          notify_mode: failure_and_fixed
