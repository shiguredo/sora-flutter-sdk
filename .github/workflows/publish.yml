# 一時停止中。pub.dev の公開先が整うまで自動公開を行わない。
name: pub.dev に公開

on:
  # 自動公開を停止している間も workflow の定義を有効に保つため、手動起動だけを残す。
  workflow_dispatch:
  # pub.dev の公開先が整ったら、以下の push フックだけを有効にする。
  #   push:
  #     tags:
  #       # pub.dev 側の tag pattern は {{version}} に合わせる。
  #       # 安定版: 2026.0.0 / canary: 2026.1.0-canary.0 形式。
  #       # GitHub 側ではこの形式のタグを保護し、作成権限を制限する。
  #       - "[0-9]+.[0-9]+.[0-9]+"
  #       - "[0-9]+.[0-9]+.[0-9]+-canary.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    # 手動起動ではタグがないため、公開処理を実行しない。
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    # pub.dev の OIDC 認証とリポジトリ checkout に必要な権限。
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      # 必要なレビュアーを GitHub 側の環境保護ルールで指定できるようにする。
      environment: pub.dev
