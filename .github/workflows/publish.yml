# バージョンタグの push で pub.dev に公開する。
# canary 版のみ CHANGELOG 未記載の警告を無視する。安定版では警告をエラー扱いにする。
# pub.dev の package metadata 障害 (dart-lang/pub-dev#9576) の回避策を含む。
# 障害が復旧したらトークン削除と --skip-validation の回避策を外す。
name: pub.dev に公開

on:
  push:
    tags:
      # pub.dev 側の tag pattern は {{version}} に合わせる。
      # 安定版: 2026.0.0 / canary: 2026.1.0-canary.0 形式。
      # GitHub 側ではこの形式のタグを保護し、作成権限を制限する。
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-canary.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to pub.dev
    # pub.dev の OIDC 認証と環境保護ルール用。
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # OIDC トークン取得に必要。dart-lang/setup-dart の publish workflow と同じ pin を使う。
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1

      # Flutter パッケージの公開に必要。dart-lang/setup-dart の publish workflow と同じ pin を使う。
      - uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f

      - name: canary 版か判定する
        id: release
        run: |
          if [[ "${{ github.ref_name }}" =~ -canary\.[0-9]+$ ]]; then
            echo "ignore_warnings=true" >> "$GITHUB_OUTPUT"
          else
            echo "ignore_warnings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: OIDC トークンを削除する
        # pub.dev の package metadata エンドポイントが Authorization ヘッダ付きで
        # 403 を返す障害 (dart-lang/pub-dev#9576) を回避するため、依存解決と
        # dry-run の間はトークン登録を外す。PUB_TOKEN 環境変数は setup-dart が
        # 設定済みなので、公開直前に再登録する。
        run: dart pub token remove https://pub.dev

      - name: Install dependencies
        run: dart pub get

      - name: Publish - dry run
        run: |
          args=(pub publish --dry-run)
          if [[ "${{ steps.release.outputs.ignore_warnings }}" == "true" ]]; then
            args+=(--ignore-warnings)
          fi
          dart "${args[@]}"

      - name: Publish to pub.dev
        run: |
          # 公開直前に OIDC トークンを再登録する。--ignore-warnings は dry-run
          # 専用のため本番では指定しない。
          dart pub token add https://pub.dev --env-var PUB_TOKEN
          # トークン付きの依存解決を避けるため --skip-validation を使う。
          # 検証は直前の dry-run で済ませている。
          dart pub publish --force --skip-validation
